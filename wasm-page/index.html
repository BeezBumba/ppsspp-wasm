<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPSSPP Wasm Test</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #1b2025;
      --line: #303842;
      --text: #eef3f7;
      --muted: #aeb8c2;
      --accent: #36c08a;
      --danger: #ff7777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header,
    footer {
      padding: 12px 16px;
      background: var(--panel);
      border-color: var(--line);
    }

    header {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button,
    label.file {
      border: 1px solid var(--line);
      background: #252b31;
      color: var(--text);
      border-radius: 6px;
      padding: 8px 11px;
      cursor: pointer;
      font: inherit;
    }

    button.primary {
      background: var(--accent);
      color: #07110d;
      border-color: var(--accent);
      font-weight: 700;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      min-height: 0;
      overflow: hidden;
    }

    .stage {
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 14px;
      background: #07090b;
    }

    canvas {
      width: min(100%, calc((100vh - 130px) * 16 / 9));
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 130px);
      background: #000;
      outline: 1px solid var(--line);
    }

    aside {
      border-left: 1px solid var(--line);
      background: #15191d;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .status {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      min-height: 44px;
    }

    pre {
      margin: 0;
      padding: 12px;
      white-space: pre-wrap;
      overflow-y: auto;
      overflow-x: hidden;
      color: #d9e3ea;
      font-size: 12px;
      min-height: 0;
      word-break: break-all;
    }

    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) 200px;
        overflow: hidden;
      }

      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
        overflow: hidden;
      }

      canvas {
        width: 100%;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>PPSSPP Wasm Test</h1>
    <div class="controls">
      <label class="file">
        ISO/CSO/PBP
        <input id="gameFile" type="file" accept=".iso,.cso,.pbp,.elf,.prx">
      </label>
      <button id="startBtn" class="primary">Avvia</button>
      <button id="fullscreenBtn">Fullscreen</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
    </section>
    <aside>
      <div id="status" class="status">Pronto. Scegli un file o avvia solo la UI.</div>
      <pre id="log"></pre>
    </aside>
  </main>

  <footer>
    Per i thread wasm usa dal root del repo: <code>python3 wasm-page/serve.py --port 8081</code>
  </footer>

  <script>
    const BUILD_DIR = "../build-wasm/";
    const BUILD_STAMP = String(Date.now());
    const ASSET_DIR = BUILD_DIR + "assets/";
    const MANIFEST = "assets-manifest.txt";
    const VIRTUAL_ASSETS = "/emsdk/upstream/emscripten/cache/sysroot/share/ppsspp/assets";
    const VIRTUAL_GAME_DIR = "/games";

    const canvas = document.getElementById("canvas");
    const fileInput = document.getElementById("gameFile");
    const startBtn = document.getElementById("startBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");

    let selectedGame = null;
    let started = false;

    const MAX_LOG_LINES = 500;
    let logLines = [];

    function appendLog(text) {
      const now = new Date().toLocaleTimeString();
      const line = `[${now}] ${text}`;
      logLines.push(line);
      if (logLines.length > MAX_LOG_LINES) logLines.splice(0, logLines.length - MAX_LOG_LINES);
      logEl.textContent = logLines.join("\n") + "\n";
      logEl.scrollTop = logEl.scrollHeight;
      console.log(line);
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
      appendLog((isError ? "STATUS ERROR: " : "STATUS: ") + text);
    }

    appendLog("Pagina caricata. crossOriginIsolated=" + window.crossOriginIsolated);
    appendLog("Build stamp: " + BUILD_STAMP);

    window.addEventListener("error", (event) => {
      appendLog("JS ERROR: " + (event.message || event.error || "errore sconosciuto"));
    });

    window.addEventListener("unhandledrejection", (event) => {
      appendLog("JS PROMISE ERROR: " + (event.reason?.stack || event.reason || "errore sconosciuto"));
    });

    function dirname(path) {
      const slash = path.lastIndexOf("/");
      return slash === -1 ? "" : path.slice(0, slash);
    }

    async function preloadAssets(FS) {
      appendLog("Carico manifest asset: " + MANIFEST);
      const manifestResponse = await fetch(MANIFEST, { cache: "no-store" });
      if (!manifestResponse.ok) {
        throw new Error("Manifest asset non trovato: " + manifestResponse.status);
      }

      const files = (await manifestResponse.text())
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean);

      FS.mkdirTree(VIRTUAL_ASSETS);
      appendLog("Asset nel manifest: " + files.length);
      for (let i = 0; i < files.length; i++) {
        const rel = files[i];
        const target = VIRTUAL_ASSETS + "/" + rel;
        const dir = dirname(target);
        if (dir) {
          FS.mkdirTree(dir);
        }

        setStatus(`Caricamento asset ${i + 1}/${files.length}: ${rel}`);
        const response = await fetch(ASSET_DIR + rel);
        if (!response.ok) {
          throw new Error(`Asset non trovato: ${rel} (${response.status})`);
        }
        FS.writeFile(target, new Uint8Array(await response.arrayBuffer()));
      }
      appendLog("Asset caricati in MEMFS.");
    }

    async function preloadGame(FS) {
      if (!selectedGame) {
        return null;
      }

      FS.mkdirTree(VIRTUAL_GAME_DIR);
      const safeName = selectedGame.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const gamePath = VIRTUAL_GAME_DIR + "/" + safeName;
      setStatus("Caricamento gioco in memoria: " + selectedGame.name);
      FS.writeFile(gamePath, new Uint8Array(await selectedGame.arrayBuffer()));
      appendLog("Gioco montato in MEMFS: " + gamePath);
      return gamePath;
    }

    async function start() {
      if (started) {
        return;
      }
      started = true;
      appendLog("Start premuto.");
      startBtn.disabled = true;
      fileInput.disabled = true;
      canvas.focus();

      let gameArg = null;

      // With -sPROXY_TO_PTHREAD, Emscripten transfers the canvas to a Web
      // Worker via OffscreenCanvas. The canvas element MUST NOT have had any
      // getContext() call before this point (the browser would otherwise own
      // the context and the transfer would fail). Module.canvas must be set
      // before the PPSSPPSDL.js script executes.
      window.Module = {
        canvas,
        arguments: [],
        locateFile(path) {
          let url = BUILD_DIR + path;
          if (path.endsWith(".wasm") || path.endsWith(".worker.js")) {
            url += "?v=" + BUILD_STAMP;
          }
          appendLog("locateFile: " + path + " -> " + url);
          return url;
        },
        print(text) {
          appendLog("stdout: " + text);
        },
        printErr(text) {
          appendLog("stderr: " + text);
        },
        setStatus(text) {
          if (text) {
            setStatus(text);
          }
        },
        monitorRunDependencies(left) {
          appendLog("Run dependencies rimaste: " + left);
          if (left > 0) {
            setStatus(`Inizializzazione runtime: ${left}`);
          }
        },
        preRun: [function () {
          appendLog("preRun iniziato.");
          addRunDependency("ppsspp-assets");
          (async () => {
            try {
              await preloadAssets(FS);
              gameArg = await preloadGame(FS);
              Module.arguments.length = 0;
              if (gameArg) {
                Module.arguments.push(gameArg);
              }
              setStatus("Avvio PPSSPP...");
            } catch (error) {
              appendLog("preRun fallito: " + (error?.stack || error));
              setStatus(error.message || String(error), true);
              throw error;
            } finally {
              appendLog("preRun completato, rimuovo dependency asset.");
              removeRunDependency("ppsspp-assets");
            }
          })();
        }],
        onRuntimeInitialized() {
          appendLog("Runtime inizializzato.");
          setStatus(gameArg ? "Runtime pronto, avvio gioco..." : "Runtime pronto, avvio UI...");
        },
        onAbort(reason) {
          appendLog("Abort runtime: " + reason);
          setStatus("Abort: " + reason, true);
        }
      };

      const script = document.createElement("script");
      script.src = BUILD_DIR + "PPSSPPSDL.js?v=" + BUILD_STAMP;
      appendLog("Carico script: " + script.src);
      script.onload = () => appendLog("Script PPSSPPSDL.js caricato.");
      script.onerror = () => setStatus("Impossibile caricare PPSSPPSDL.js", true);
      document.body.appendChild(script);
    }

    fileInput.addEventListener("change", () => {
      selectedGame = fileInput.files[0] || null;
      setStatus(selectedGame ? `Selezionato: ${selectedGame.name}` : "Pronto. Scegli un file o avvia solo la UI.");
    });

    startBtn.addEventListener("click", start);
    fullscreenBtn.addEventListener("click", () => {
      canvas.requestFullscreen?.();
      canvas.focus();
    });
  </script>
</body>
</html>
