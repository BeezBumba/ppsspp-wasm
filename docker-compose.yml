services:
  ppsspp-wasm-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8081:8081"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    working_dir: /app/server
    command:
      - python3
      - serve.py
      - --https
      - --bind
      - 0.0.0.0
      - --port
      - "8081"
